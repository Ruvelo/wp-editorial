<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Rendered at 128×128 (and ×2) into .wordpress-org/icon-*.png by bin/screenshots.sh. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@600&display=swap">
    <style>
        html, body { margin: 0; width: 128px; height: 128px; overflow: hidden; background: transparent; }
        .tile { width: 128px; height: 128px; border-radius: 30px; background: linear-gradient(135deg, #3d4eff, #a78bfa); position: relative; }
        .tile span { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-52%); text-align: center; color: #fff; font: 600 76px/1 "Geist", sans-serif; letter-spacing: -.03em; }
        .tile i { position: absolute; right: 25px; top: 25px; width: 15px; height: 15px; border-radius: 50%; background: #fff; }
    </style>
</head>
<body><div class="tile"><span>E</span></div></body>
</html>
