<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Rendered at 772×250 (and ×2) into .wordpress-org/banner-*.png by bin/screenshots.sh. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
    <style>
        html, body { margin: 0; width: 772px; height: 250px; overflow: hidden; background: #fff; color: #16162a; }
        body { position: relative; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
        body::before { content: ""; position: absolute; inset: 0; background: linear-gradient(#e4e4ef 1px, transparent 1px) 0 0 / 44px 44px, linear-gradient(90deg, #e4e4ef 1px, transparent 1px) 0 0 / 44px 44px; mask: linear-gradient(180deg, rgb(0 0 0 / .55), transparent 75%); }
        .stripe { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #3d4eff, #a78bfa); }
        .copy { position: absolute; left: 40px; top: 40px; width: 330px; }
        .lockup { display: flex; align-items: center; gap: 12px; }
        .tile { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, #3d4eff, #a78bfa); color: #fff; font: 600 20px/1 "Geist"; box-shadow: 0 8px 18px -8px rgb(61 78 255 / .7); }
        .name { font: 600 19px/1.15 "Geist"; letter-spacing: -.02em; }
        .by { font: 400 13px/1.3 "Geist"; color: #74748b; }
        .by b { color: #16162a; font-weight: 600; }
        .by b i { font-style: normal; color: #3d4eff; }
        h1 { font: 600 31px/1.08 "Geist"; letter-spacing: -.04em; margin: 26px 0 10px; }
        p { font: 400 14px/1.45 "Geist"; color: #4b4b63; margin: 0; }
        .glow { position: absolute; right: -60px; top: 10px; width: 480px; height: 300px; background: radial-gradient(closest-side, rgb(167 139 250 / .45), transparent); }
        .shot { position: absolute; left: 392px; top: 34px; width: 520px; border: 1px solid #e4e4ef; border-radius: 12px; box-shadow: 0 24px 50px -24px rgb(61 78 255 / .5); }
    </style>
</head>
<body>
    <div class="stripe"></div>
    <div class="glow"></div>
    <div class="copy">
        <div class="lockup"><span class="tile">E</span><div><div class="name">Ruvelo Editorial</div><div class="by">by <b>ruvelo<i>.</i></b></div></div></div>
        <h1>Reviewed, approved, then published.</h1>
        <p>A review queue, assigned reviewers and publish gates, built on WordPress Notes.</p>
    </div>
    <img class="shot" src="queue-crop.png" alt="">
</body>
</html>
