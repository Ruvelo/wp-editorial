name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: WordPress security, database and i18n sniffs (PHPCS)
        run: vendor/bin/phpcs

      - name: Static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        wordpress: ['7.0', 'latest']

    name: PHP ${{ matrix.php }} · WordPress ${{ matrix.wordpress }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_DB_ENGINE: mysql
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: root
      WP_DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl
          tools: wp-cli
          coverage: none

      - name: Download WordPress ${{ matrix.wordpress }}
        run: wp core download --path=$WP_CORE_DIR --version=${{ matrix.wordpress }}

      - name: Match the test suite to WordPress
        run: |
          version=$(php -r 'include getenv("WP_CORE_DIR")."/wp-includes/version.php"; echo $wp_version;')
          composer require --dev "wp-phpunit/wp-phpunit:~${version%.*}.0" --no-interaction --no-update -W

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the plugin
        run: bash bin/build-zip.sh

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/ruvelo-editorial
